<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ด่านที่ 4: ความน่าจะเป็น</title>
    <link rel="stylesheet" href="../shared/game-style.css">
</head>
<body>
    <div class="top-bar">
        <div class="badge timer-badge" id="timer-badge" role="timer" aria-live="off" title="เวลาที่เหลือ 2 นาที">
            <span class="timer-icon">⏱️</span>
            <span id="timer-val">02:00</span>
            <div class="timer-bar-track"><div class="timer-bar-fill" id="timer-bar-fill"></div></div>
        </div>
        <div class="badge" id="progress-badge">ข้อ 1 / 20</div>
        <div class="badge score-badge" id="score-badge">
            <span class="score-icon">💎</span>
            <span>คะแนน: <b id="score-val">0</b></span>
        </div>
    </div>

    <div id="play-view" class="view active">
        <div class="question-box">
            <div class="q-category" id="q-cat-label"></div>
            <div class="q-text" id="q-text-label"></div>
        </div>
        <div class="ar-spacer"><div id="feedback-toast" role="status"></div></div>
        <p class="answer-hint">เลือก 1 คำตอบ · ชี้แล้วจีบนิ้ว หรือคลิกคำตอบ</p><div class="choices-grid" id="choices-container"></div>
    </div>

    <div id="result-view" class="view">
        <div class="summary-card">
            <div class="result-trophy" id="result-trophy">🏆</div>
            <h2 id="result-title">🎉 สรุปผลการเล่น!</h2>
            <p id="result-subtitle">สรุปคะแนนความน่าจะเป็นเบื้องต้น</p>
            <div class="final-score-wrap">
                <span class="final-score-label">คะแนนรวม</span>
                <div class="final-score" id="final-score-val">0</div>
                <div class="score-grade-pill master" id="score-grade">ระดับ: ยอดเยี่ยม! 🌟</div>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-icon">⏱️</span>
                    <span class="stat-val" id="stat-time">00:00</span>
                    <span class="stat-name">เวลาที่ใช้</span>
                </div>
                <div class="stat-card">
                    <span class="stat-icon">✅</span>
                    <span class="stat-val correct" id="stat-correct">0</span>
                    <span class="stat-name">ตอบถูก (+10)</span>
                </div>
                <div class="stat-card">
                    <span class="stat-icon">❌</span>
                    <span class="stat-val wrong" id="stat-wrong">0</span>
                    <span class="stat-name">ตอบผิด (-10)</span>
                </div>
                <div class="stat-card">
                    <span class="stat-icon">🎯</span>
                    <span class="stat-val" id="stat-accuracy">0%</span>
                    <span class="stat-name">ความแม่นยำ</span>
                </div>
            </div>
            <div class="summary-buttons">
                <button class="btn-restart ar-target" id="btn-restart" type="button">🔄 เล่นด่านนี้อีกครั้ง</button>
            </div>
        </div>
    </div>

    <script>
        const STAGE_TITLE = "หมวดที่ 4: ความน่าจะเป็นเบื้องต้น (โอกาสเกิดเหตุการณ์)";
        const GAME_QUESTIONS = [
            { q: "31. โยนเหรียญ 1 เหรียญ โอกาสที่จะออก \"หัว\" เป็นเท่าใด", choices: ["1/2", "1/4"], ans: "1/2" },
            { q: "32. ทอดลูกเต๋า 1 ลูก โอกาสที่จะได้แต้ม \"1\" เป็นเท่าใด", choices: ["1/6", "1/2"], ans: "1/6" },
            { q: "33. ทอดลูกเต๋า 1 ลูก โอกาสที่จะได้แต้มคู่ (2, 4, 6) เป็นเท่าใด", choices: ["3/6 (หรือ 1/2)", "1/6"], ans: "3/6 (หรือ 1/2)" },
            { q: "34. ในกล่องมีลูกปิงปองสีขาว 1 ลูก สีส้ม 1 ลูก สุ่มหยิบ 1 ลูก โอกาสที่จะได้สีขาวเป็นเท่าใด", choices: ["1/2", "1"], ans: "1/2" },
            { q: "35. สลากมีเลข 1, 2, 3, 4, 5 สุ่มหยิบ 1 ใบ โอกาสที่จะได้เลข \"5\" เป็นเท่าใด", choices: ["1/5", "5/5"], ans: "1/5" },
            { q: "36. สลากมีเลข 1 ถึง 5 หยิบ 1 ใบ โอกาสที่จะได้เลขคี่ (1, 3, 5) เป็นเท่าใด", choices: ["3/5", "2/5"], ans: "3/5" },
            { q: "37. กล่องมีลูกบอลสีแดง 2 ลูก สีฟ้า 3 ลูก (รวม 5 ลูก) โอกาสที่จะหยิบได้สีแดงเป็นเท่าใด", choices: ["2/5", "3/5"], ans: "2/5" },
            { q: "38. กล่องมีลูกบอลสีแดง 2 ลูก สีฟ้า 3 ลูก (รวม 5 ลูก) โอกาสที่จะหยิบได้สีฟ้าเป็นเท่าใด", choices: ["3/5", "2/5"], ans: "3/5" },
            { q: "39. โยนเหรียญ 2 เหรียญ โอกาสที่จะออก \"หัว\" ทั้ง 2 เหรียญเป็นเท่าใด", choices: ["1/4", "2/4"], ans: "1/4" },
            { q: "40. โยนเหรียญ 2 เหรียญ โอกาสที่จะออก \"ก้อย\" ทั้ง 2 เหรียญเป็นเท่าใด", choices: ["1/4", "2/4"], ans: "1/4" },
            { q: "41. โยนเหรียญ 2 เหรียญ โอกาสที่จะออกหน้าเหมือนกัน (หัว-หัว หรือ ก้อย-ก้อย) เป็นเท่าใด", choices: ["2/4 (หรือ 1/2)", "1/4"], ans: "2/4 (หรือ 1/2)" },
            { q: "42. โยนเหรียญ 2 เหรียญ โอกาสที่จะออกหน้าต่างกัน (หัว-ก้อย หรือ ก้อย-หัว) เป็นเท่าใด", choices: ["2/4 (หรือ 1/2)", "1/4"], ans: "2/4 (หรือ 1/2)" },
            { q: "43. หมุนวงล้อที่มี 4 ช่องเท่าๆ กัน (แดง, เหลือง, เขียว, น้ำเงิน) โอกาสที่เข็มจะชี้สีแดงเป็นเท่าใด", choices: ["1/4", "1/2"], ans: "1/4" },
            { q: "44. กล่องมีแต่ลูกบอลสีขาว 3 ลูก โอกาสที่จะหยิบได้สีแดงเป็นเท่าใด", choices: ["0", "1/3"], ans: "0" },
            { q: "45. กล่องมีลูกบอลสีดำทั้งหมด 5 ลูก โอกาสที่จะหยิบได้สีดำเป็นเท่าใด", choices: ["1 (หรือ 5/5)", "0"], ans: "1 (หรือ 5/5)" },
            { q: "46. สุ่มเลือกอักษร 1 ตัวจากคำว่า \"CAT\" โอกาสที่จะได้อักษร \"A\" เป็นเท่าใด", choices: ["1/3", "1/2"], ans: "1/3" },
            { q: "47. สุ่มเลือกอักษร 1 ตัวจากคำว่า \"DOG\" โอกาสที่จะได้อักษร \"Z\" เป็นเท่าใด", choices: ["0", "1/3"], ans: "0" },
            { q: "48. ทอดลูกเต๋า 1 ลูก โอกาสที่จะได้แต้มมากกว่า 4 (คือ 5 กับ 6) เป็นเท่าใด", choices: ["2/6 (หรือ 1/3)", "1/6"], ans: "2/6 (หรือ 1/3)" },
            { q: "49. ทอดลูกเต๋า 1 ลูก โอกาสที่จะได้แต้มไม่เกิน 3 (คือ 1, 2, 3) เป็นเท่าใด", choices: ["3/6 (หรือ 1/2)", "2/6"], ans: "3/6 (หรือ 1/2)" },
            { q: "50. ซื้อสลาก 1 ใบ จากสลากทั้งหมด 10 ใบ โอกาสที่จะถูกรางวัลที่หนึ่งเป็นเท่าใด", choices: ["1/10", "1/100"], ans: "1/10" }
        ];
    </script>
    <script src="../shared/interactions.js"></script>
    <script src="../shared/game-engine.js"></script>
</body>
</html>
