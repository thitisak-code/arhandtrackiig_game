<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ด่านที่ 4: ความน่าจะเป็น</title>
    <link rel="stylesheet" href="../shared/game-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="top-bar">
        <div class="badge timer-badge" id="timer-badge" role="timer" aria-live="off" title="เวลาที่เหลือ 2 นาที">
            <span class="timer-icon"><i class="fa-solid fa-stopwatch"></i></span>
            <span id="timer-val">02:00</span>
            <div class="timer-bar-track"><div class="timer-bar-fill" id="timer-bar-fill"></div></div>
        </div>
        <div class="badge" id="progress-badge">ข้อ 1 / 20</div>
        <div class="badge score-badge" id="score-badge">
            <span class="score-icon"><i class="fa-solid fa-gem"></i></span>
            <span>คะแนน: <b id="score-val">0</b></span>
        </div>
    </div>

    <div id="play-view" class="view active">
        <div class="question-box">
            <div class="q-category" id="q-cat-label"></div>
            <div class="q-text" id="q-text-label"></div>
        </div>
        <div class="ar-spacer"><div id="feedback-toast" role="status"></div></div>
        <p class="answer-hint">เลือก 1 คำตอบ · ชี้แล้วจีบนิ้ว หรือคลิกคำตอบ</p><div class="choices-grid" id="choices-container"></div>
    </div>

    <div id="result-view" class="view">
        <div class="summary-card">
            <div class="result-trophy" id="result-trophy"><i class="fa-solid fa-trophy"></i></div>
            <h2 id="result-title"><i class="fa-solid fa-award"></i> สรุปผลการเล่น!</h2>
            <p id="result-subtitle">สรุปคะแนนความน่าจะเป็นเบื้องต้น</p>
            <div class="final-score-wrap">
                <span class="final-score-label">คะแนนรวม</span>
                <div class="final-score" id="final-score-val">0</div>
                <div class="score-grade-pill master" id="score-grade"><i class="fa-solid fa-star"></i> ระดับ: ยอดเยี่ยม!</div>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-icon"><i class="fa-solid fa-stopwatch"></i></span>
                    <span class="stat-val" id="stat-time">00:00</span>
                    <span class="stat-name">เวลาที่ใช้</span>
                </div>
                <div class="stat-card">
                    <span class="stat-icon"><i class="fa-solid fa-circle-check"></i></span>
                    <span class="stat-val correct" id="stat-correct">0</span>
                    <span class="stat-name">ตอบถูก (+10)</span>
                </div>
                <div class="stat-card">
                    <span class="stat-icon"><i class="fa-solid fa-circle-xmark"></i></span>
                    <span class="stat-val wrong" id="stat-wrong">0</span>
                    <span class="stat-name">ตอบผิด (-10)</span>
                </div>
                <div class="stat-card">
                    <span class="stat-icon"><i class="fa-solid fa-chart-pie"></i></span>
                    <span class="stat-val" id="stat-accuracy">0%</span>
                    <span class="stat-name">ความแม่นยำ</span>
                </div>
            </div>
            <div class="summary-buttons">
                <button class="btn-restart ar-target" id="btn-restart" type="button"><i class="fa-solid fa-rotate-right"></i> เล่นด่านนี้อีกครั้ง</button>
            </div>
        </div>
    </div>

    <script>
        const STAGE_TITLE = "หมวดที่ 4: ความน่าจะเป็นเบื้องต้น (โอกาสเกิดเหตุการณ์)";
        const GAME_QUESTIONS = [
            { q: "31. โยนเหรียญ 1 เหรียญ โอกาสที่จะออก \"หัว\" เป็นเท่าใด", choices: ["1/2", "1/4"], ans: "1/2" },
            { q: "32. ทอดลูกเต๋า 1 ลูก โอกาสที่จะได้แต้ม \"1\" เป็นเท่าใด", choices: ["1/6", "1/2"], ans: "1/6" },
            { q: "33. ทอดลูกเต๋า 1 ลูก โอกาสที่จะได้แต้มคู่ (2, 4, 6) เป็นเท่าใด", choices: ["3/6 (หรือ 1/2)", "1/6"], ans: "3/6 (หรือ 1/2)" },
            { q: "34. ในถุงมีลูกแก้วสีฟ้า 3 ลูก สีแดง 1 ลูก สุ่มหยิบ 1 ลูก โอกาสได้สีแดงเป็นเท่าใด", choices: ["1/4", "3/4"], ans: "1/4" },
            { q: "35. หมุนวงล้อที่มี 4 ช่องเท่ากัน (แดง, ฟ้า, เหลือง, เขียว) โอกาสตกช่องสีฟ้าเป็นเท่าใด", choices: ["1/4", "1/2"], ans: "1/4" },
            { q: "36. ความน่าจะเป็นที่จะเกิดเหตุการณ์ที่เป็นไปไม่ได้แน่นอน มีค่าเท่ากับเท่าใด", choices: ["0", "1"], ans: "0" },
            { q: "37. ความน่าจะเป็นที่จะเกิดเหตุการณ์ที่เกิดขึ้นแน่นอน 100% มีค่าเท่ากับเท่าใด", choices: ["1", "0"], ans: "1" },
            { q: "38. ทอดลูกเต๋า 1 ลูก โอกาสที่จะได้แต้มมากกว่า 4 (คือ 5, 6) เป็นเท่าใด", choices: ["2/6 (หรือ 1/3)", "4/6"], ans: "2/6 (หรือ 1/3)" },
            { q: "39. โยนเหรียญ 1 เหรียญ โอกาสที่จะออก \"ก้อย\" คิดเป็นร้อยละเท่าใด", choices: ["ร้อยละ 50", "ร้อยละ 25"], ans: "ร้อยละ 50" },
            { q: "40. สุ่มหยิบไพ่ 1 ใบจากสำรับ โอกาสได้แต้มเป็นเลขคู่เทียบกับเลขคี่ ฝั่งใดมีโอกาสมากกว่า", choices: ["เท่ากัน", "เลขคู่มากกว่า"], ans: "เท่ากัน" },
            { q: "41. สุ่มตัวเลข 1 ตัวจากเลข 1 ถึง 10 โอกาสได้เลข 7 เป็นเท่าใด", choices: ["1/10", "7/10"], ans: "1/10" },
            { q: "42. สุ่มตัวเลข 1 ตัวจากเลข 1 ถึง 10 โอกาสได้เลขคู่ (2,4,6,8,10) เป็นเท่าใด", choices: ["5/10 (หรือ 1/2)", "2/10"], ans: "5/10 (หรือ 1/2)" },
            { q: "43. ในกล่องมีปากกาหมึกซึม 5 ด้าม หมึกลบได้ 5 ด้าม สุ่มหยิบ 1 ด้าม โอกาสได้หมึกซึมเป็นเท่าใด", choices: ["5/10 (หรือ 1/2)", "1/5"], ans: "5/10 (หรือ 1/2)" },
            { q: "44. ทอดลูกเต๋า 1 ลูก โอกาสที่จะได้แต้ม \"7\" เป็นเท่าใด", choices: ["0 (เป็นไปไม่ได้)", "1/6"], ans: "0 (เป็นไปไม่ได้)" },
            { q: "45. โยนเหรียญ 2 อันพร้อมกัน โอกาสที่จะออก \"หัวทั้งสองเหรียญ\" (HH จาก 4 แบบ) เป็นเท่าใด", choices: ["1/4", "1/2"], ans: "1/4" },
            { q: "46. สุ่มเลือกวันใน 1 สัปดาห์ โอกาสที่จะได้ \"วันเสาร์หรืออาทิตย์\" เป็นเท่าใด", choices: ["2/7", "1/7"], ans: "2/7" },
            { q: "47. สูตรความน่าจะเป็นของเหตุการณ์ E คือข้อใด", choices: ["P(E) = n(E) / n(S)", "P(E) = n(S) / n(E)"], ans: "P(E) = n(E) / n(S)" },
            { q: "48. ค่าของความน่าจะเป็น P(E) จะต้องอยู่ในช่วงใดเสมอ", choices: ["0 ถึง 1", "-1 ถึง 1"], ans: "0 ถึง 1" },
            { q: "49. กล่องใบหนึ่งมีลูกบอลสีขาว 10 ลูก สุ่มหยิบ 1 ลูก โอกาสได้ลูกบอลสีขาวเป็นเท่าใด", choices: ["1 (แน่นอน)", "0.5"], ans: "1 (แน่นอน)" },
            { q: "50. ถ้าความน่าจะเป็นที่ฝนจะตกคือ 0.3 ความน่าจะเป็นที่ฝนจะไม่ตกคือเท่าใด (1 - 0.3)", choices: ["0.7", "0.3"], ans: "0.7" }
        ];
    </script>
    <script src="../shared/interactions.js"></script>
    <script src="../shared/game-engine.js"></script>
</body>
</html>
